# The deterministic gate for a git-marketplace Codex plugin. There is no pinned
# `codex plugin validate` step (the subcommand + its behavior are version-dependent);
# Codex-CLI validation is a documented manual step (see docs/e2e-checklist.md).
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (with coverage)
        run: npm run test
