# The deterministic gate for a git-marketplace Codex plugin. There is no pinned
# `codex plugin validate` step (the subcommand + its behavior are version-dependent);
# Codex-CLI validation is a documented manual step (see docs/e2e-checklist.md).
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (with coverage)
        run: npm run test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate the ChatGPT portal ZIP
        run: npm run export:chatgpt -- .
      - name: Upload ChatGPT portal package
        uses: actions/upload-artifact@v4
        with:
          name: lantern-chatgpt-plugin
          path: |
            dist/chatgpt/*.zip
            dist/chatgpt/*.sha256
          if-no-files-found: error
